[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venture-pilot"
version = "0.1.0"
description = "A human-in-the-loop customer-discovery co-pilot: cited research, drafted artifacts, and an honest STOP/PIVOT/CONTINUE verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Use a Claude Pro/Max subscription instead of an API key (the `--sdk` backend).
sdk = ["claude-agent-sdk>=0.2"]

[project.scripts]
vp = "vp.cli:main"

[tool.setuptools]
packages = ["vp", "vp.agents"]

[tool.pytest.ini_options]
testpaths = ["vp/tests"]
