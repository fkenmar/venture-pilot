[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venture-pilot"
version = "0.1.0"
description = "A human-in-the-loop customer-discovery co-pilot: cited research, drafted artifacts, and an honest STOP/PIVOT/CONTINUE verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
# claude-agent-sdk powers --sdk (Claude Pro/Max subscription, no API key);
# anthropic powers --api (your own key). Both ship by default so `vp` works
# with Claude out of the box — no offline surprise.
dependencies = ["anthropic>=0.40", "claude-agent-sdk>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vp = "vp.cli:main"

[tool.setuptools]
packages = ["vp", "vp.agents"]

[tool.pytest.ini_options]
testpaths = ["vp/tests"]
